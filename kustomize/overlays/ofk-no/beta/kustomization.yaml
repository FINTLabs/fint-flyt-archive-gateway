apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ofk-no

resources:
  - ../../../base

labels:
  - pairs:
      app.kubernetes.io/instance: fint-flyt-archive-gateway_ofk_no
      fintlabs.no/org-id: ofk.no

patches:
  - patch: |-
      - op: replace
        path: "/metadata/labels/app.kubernetes.io~1instance"
        value: "fint-archive-gateway_ofk_no"
      - op: replace
        path: "/spec/kafka/acls/0/topic"
        value: "ofk-no.flyt.*"
      - op: replace
        path: "/spec/orgId"
        value: "ofk.no"
      - op: replace
        path: "/spec/ingress/routes/0/path"
        value: "/beta/ofk-no/api/intern/arkiv"
      - op: replace
        path: "/spec/observability/metrics/path"
        value: "/beta/ofk-no/actuator/prometheus"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.flyt.archive.gateway.client.fint-archive.base-url"
          value: "https://beta.felleskomponent.no"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.kafka.topic.orgId"
          value: "ofk-no"
      - op: add
        path: "/spec/env/-"
        value:
          name: "server.servlet.context-path"
          value: "/beta/ofk-no"
      - op: add
        path: "/spec/env/-"
        value:
          name: "novari.flyt.security.tenant.additional-org-ids"
          value: "frid-iks.no"
      - op: replace
        path: "/spec/onePassword/itemPath"
        value: "vaults/aks-beta-vault/items/fint-flyt-v1-slack-webhook"
      - op: replace
        path: "/spec/probes/startup/path"
        value: "/beta/ofk-no/actuator/health"
      - op: replace
        path: "/spec/probes/readiness/path"
        value: "/beta/ofk-no/actuator/health/readiness"
      - op: replace
        path: "/spec/probes/liveness/path"
        value: "/beta/ofk-no/actuator/health/liveness"
    target:
      kind: Application
      name: fint-flyt-archive-gateway

  - patch: |-
      - op: replace
        path: "/metadata/labels/app.kubernetes.io~1instance"
        value: "fint-flyt-archive-fint-client_ofk_no"
      - op: replace
        path: "/spec/orgId"
        value: "ofk.no"
    target:
      kind: FintClient
      name: fint-flyt-archive-fint-client
